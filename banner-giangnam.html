<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner Giới Thiệu - Thầy Nguyễn Giang Nam</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: transparent;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-color: #0b0f19;
        }

        .marquee-wrapper {
            width: 100vw;
            overflow: hidden;
            background: linear-gradient(90deg, #0b0f19, #1e293b, #0b0f19);
            padding: 12px 0;
            border-top: 2px solid #38bdf8;
            border-bottom: 2px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
        }

        .marquee-content {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 28s linear infinite;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .marquee-content span {
            color: #f8fafc;
            margin-right: 15px;
        }

        .marquee-content .highlight {
            color: #38bdf8;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
        }

        .marquee-content .blink-text {
            animation: blink 1.2s ease-in-out infinite;
            color: #facc15;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.7);
        }

        .marquee-content a {
            color: #4ade80;
            text-decoration: none;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.7);
            transition: color 0.3s;
            margin-left: 10px;
        }

        .marquee-content a:hover {
            color: #f43f5e;
            text-shadow: 0 0 10px rgba(244, 63, 94, 0.9);
        }

        @keyframes marquee {
            0% {
                transform: translateX(100vw);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
    </style>
</head>
<body>

    <div class="marquee-wrapper">
        <div class="marquee-content">
            <span>👨‍🏫 Chào mừng đến với không gian trực tuyến của <span class="highlight">Thầy Nguyễn Giang Nam</span></span>
            <span>|</span>
            <span>Kỹ sư Điện - Tự động hóa</span>
            <span>|</span>
            <span>Giáo viên tại <span class="highlight">Trung tâm GDNN-GDTX Gio Linh</span></span>
            <span>|</span>
            <span class="blink-text">⚡ Bản lĩnh kỹ thuật - Sáng tạo tri thức - Đam mê trồng người ⚡</span>
            <a href="https://giangnam146.site" target="_blank">🔗 [ TRUY CẬP GIANGNAM146.SITE ]</a>
        </div>
    </div>

</body>
</html>
